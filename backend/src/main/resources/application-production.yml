server:
  # Let Tomcat resolve Forwarded/X-Forwarded-* only through its trusted-proxy
  # rules. Controllers consume getRemoteAddr() and never trust raw headers.
  forward-headers-strategy: native

spring:
  h2:
    console:
      enabled: false
  jpa:
    properties:
      hibernate:
        format_sql: false
  thymeleaf:
    cache: true

sauti:
  providers:
    # Existing production installations may predate PROVIDER_MODE. Production
    # must never inherit the development-only `fake` default from application.yml.
    mode: ${PROVIDER_MODE:live}
  auth:
    expose-dev-tokens: false
  websocket:
    allowed-origin-patterns: ${SAUTI_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:${SAUTI_CORS_ALLOWED_ORIGINS:}}
