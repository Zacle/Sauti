<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>Sauti payment confirmed</title>
</head>
<body style="margin:0;padding:0;background:#f7f6f3;color:#23221f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
<div th:replace="~{email/parts :: preheader('Your Sauti payment has been confirmed.')}"></div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#f7f6f3;">
    <tr>
        <td align="center" style="padding:40px 16px;">
            <table role="presentation" width="560" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:560px;">
                <tr><td><div th:replace="~{email/parts :: wordmark}"></div></td></tr>
                <tr>
                    <td style="background:#ffffff;border:1px solid #e7e5df;border-radius:10px;padding:32px 32px 28px;">
                        <div style="margin:0 0 14px;">
                            <span th:replace="~{email/parts :: status('success', 'Paid')}"></span>
                            <span th:if="${testMode}" style="margin-left:12px;font-size:13px;color:#a86a14;">Test payment</span>
                        </div>
                        <h1 th:replace="~{email/parts :: heading('Your payment is confirmed')}"></h1>
                        <p style="margin:12px 0 0;font-size:15px;line-height:1.6;color:#5f5c55;">
                            Thank you. Whop confirmed this payment for <strong style="color:#23221f;font-weight:600;" th:text="${businessName}">your business</strong>.
                            Your plan in Sauti updates separately once Whop tells us, usually within a minute.
                        </p>

                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                               style="margin:22px 0 0;background:#f2f1ed;border:1px solid #e7e5df;border-radius:8px;">
                            <tr>
                                <td style="padding:18px 20px;">
                                    <div style="font-size:13px;color:#8f8b82;">Amount paid</div>
                                    <div style="margin-top:6px;font-size:24px;line-height:1.2;font-weight:600;letter-spacing:-0.3px;color:#141412;">
                                        <span th:text="${currency}">USD</span> <span th:text="${amount}">149.00</span>
                                    </div>
                                    <div style="margin-top:4px;font-size:14px;color:#5f5c55;" th:text="${purchaseDescription}">Growth plan</div>
                                </td>
                            </tr>
                        </table>

                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin:22px 0 0;border-collapse:collapse;">
                            <tr th:replace="~{email/parts :: row('Paid on', ${paidAt})}"></tr>
                            <th:block th:if="${cardLast4 != null}"><tr th:replace="~{email/parts :: row('Payment method', ${'Card ending ' + cardLast4})}"></tr></th:block>
                            <tr th:replace="~{email/parts :: row('Reference', ${paymentReference})}"></tr>
                        </table>

                        <table th:replace="~{email/parts :: button(${billingUrl}, 'View billing')}"></table>
                        <table th:replace="~{email/parts :: note('This is a payment confirmation, not a tax invoice. Whop is the payment processor and keeps the billing record.')}"></table>
                    </td>
                </tr>
                <tr><td><div th:replace="~{email/parts :: footer('Questions about a charge? Reply to this email.')}"></div></td></tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
