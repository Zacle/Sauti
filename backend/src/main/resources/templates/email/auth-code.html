<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title th:text="${heading}">Sauti security code</title>
</head>
<body style="margin:0;padding:0;background:#f7f6f3;color:#23221f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
<div th:replace="~{email/parts :: preheader(${previewText})}"></div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#f7f6f3;">
    <tr>
        <td align="center" style="padding:40px 16px;">
            <table role="presentation" width="560" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:560px;">
                <tr><td><div th:replace="~{email/parts :: wordmark}"></div></td></tr>
                <tr>
                    <td style="background:#ffffff;border:1px solid #e7e5df;border-radius:10px;padding:32px 32px 28px;">
                        <p style="margin:0 0 8px;font-size:13px;color:#8f8b82;" th:text="${eyebrow}">Account security</p>
                        <h1 th:replace="~{email/parts :: heading(${heading})}"></h1>
                        <p style="margin:12px 0 0;font-size:15px;line-height:1.6;color:#5f5c55;">
                            Hi <span th:text="${businessName}">there</span>. <span th:text="${intro}">Use the code below to continue.</span>
                        </p>
                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                               style="margin:24px 0 0;background:#f2f1ed;border:1px solid #e7e5df;border-radius:8px;">
                            <tr>
                                <td align="center" style="padding:20px 16px;">
                                    <div style="font-size:13px;color:#8f8b82;" th:text="${codeLabel}">Verification code</div>
                                    <div style="margin-top:10px;font-family:'SFMono-Regular',Menlo,Consolas,monospace;font-size:30px;line-height:1;font-weight:600;letter-spacing:8px;color:#141412;"
                                         th:text="${code}">000000</div>
                                    <div style="margin-top:10px;font-size:12px;color:#8f8b82;">Expires in 15 minutes</div>
                                </td>
                            </tr>
                        </table>
                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin:28px 0 0;border-top:1px solid #e7e5df;">
                            <tr>
                                <td style="padding:16px 0 0;font-size:13px;line-height:1.6;color:#8f8b82;">
                                    <strong style="display:block;color:#5f5c55;font-weight:600;" th:text="${noticeTitle}">Keep your account secure</strong>
                                    <span th:text="${notice}">Do not share this code.</span>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr><td><div th:replace="~{email/parts :: footer('Sent automatically by Sauti. Need help? Reply to this email.')}"></div></td></tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
