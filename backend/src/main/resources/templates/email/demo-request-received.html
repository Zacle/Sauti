<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>We received your demo request</title>
</head>
<body style="margin:0;padding:0;background:#f7f6f3;color:#23221f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
<div th:replace="~{email/parts :: preheader('Thanks for your Sauti demo request. Here is what happens next.')}"></div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#f7f6f3;">
    <tr>
        <td align="center" style="padding:40px 16px;">
            <table role="presentation" width="560" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:560px;">
                <tr><td><div th:replace="~{email/parts :: wordmark}"></div></td></tr>
                <tr>
                    <td style="background:#ffffff;border:1px solid #e7e5df;border-radius:10px;padding:32px 32px 28px;">
                        <h1 th:replace="~{email/parts :: heading('We received your request')}"></h1>
                        <p style="margin:12px 0 0;font-size:15px;line-height:1.6;color:#5f5c55;">
                            Hello <span th:text="${request.contactName}">there</span>, thank you for telling us how
                            <strong style="color:#23221f;font-weight:600;" th:text="${request.businessName}">your business</strong> wants to use Sauti.
                        </p>
                        <p th:replace="~{email/parts :: paragraph('We will look at your channels, call volume and use case. If a pilot is a good fit, we will email you a private invitation to your workspace. Nothing is charged and no phone number is bought while we review.')}"></p>
                        <table th:replace="~{email/parts :: note('No need to send another request. Reply to this email if anything important changes.')}"></table>
                    </td>
                </tr>
                <tr><td><div th:replace="~{email/parts :: footer('Sauti answers your business calls in every language.')}"></div></td></tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
