<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title th:text="${'Join ' + workspaceName + ' on Sauti'}">Join the workspace on Sauti</title>
</head>
<body style="margin:0;padding:0;background:#f7f6f3;color:#23221f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;"
      th:with="inviter=${inviterEmail != null and inviterEmail != '' ? inviterEmail : 'A colleague'}">
<div th:replace="~{email/parts :: preheader(${inviter + ' invited you to ' + workspaceName + ' on Sauti.'})}"></div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#f7f6f3;">
    <tr>
        <td align="center" style="padding:40px 16px;">
            <table role="presentation" width="560" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:560px;">
                <tr><td><div th:replace="~{email/parts :: wordmark}"></div></td></tr>
                <tr>
                    <td style="background:#ffffff;border:1px solid #e7e5df;border-radius:10px;padding:32px 32px 28px;">
                        <h1 th:replace="~{email/parts :: heading(${'Join ' + workspaceName})}"></h1>
                        <p style="margin:12px 0 0;font-size:15px;line-height:1.6;color:#5f5c55;">
                            <span th:text="${inviter}">A colleague</span>
                            invited you to work in <strong style="color:#23221f;font-weight:600;" th:text="${workspaceName}">the workspace</strong>
                            on Sauti as <strong style="color:#23221f;font-weight:600;" th:text="${role}">Member</strong>.
                        </p>
                        <table th:replace="~{email/parts :: button(${acceptUrl}, 'Accept invitation')}"></table>
                        <table th:replace="~{email/parts :: note(${'This invitation is for ' + toEmail + ' and expires on ' + #temporals.format(expiresAt, 'd MMMM yyyy') + '. If you weren''t expecting it, you can ignore this email.'})}"></table>
                    </td>
                </tr>
                <tr><td><div th:replace="~{email/parts :: footer('Sauti answers your business calls in every language.')}"></div></td></tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
