<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>Update on your demo request</title>
</head>
<body style="margin:0;padding:0;background:#f7f6f3;color:#23221f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
<div th:replace="~{email/parts :: preheader('An update on your Sauti demo request.')}"></div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#f7f6f3;">
    <tr>
        <td align="center" style="padding:40px 16px;">
            <table role="presentation" width="560" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:560px;">
                <tr><td><div th:replace="~{email/parts :: wordmark}"></div></td></tr>
                <tr>
                    <td style="background:#ffffff;border:1px solid #e7e5df;border-radius:10px;padding:32px 32px 28px;">
                        <h1 th:replace="~{email/parts :: heading(${'We can''t open this pilot right now'})}"></h1>
                        <p style="margin:12px 0 0;font-size:15px;line-height:1.6;color:#5f5c55;">
                            Hello <span th:text="${request.contactName}">there</span>, thank you for considering Sauti for
                            <strong style="color:#23221f;font-weight:600;" th:text="${request.businessName}">your business</strong>.
                            After reviewing your request, we are not able to open a workspace at this time.
                        </p>
                        <table th:if="${!#strings.isEmpty(request.rejectedReason)}" role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                               style="margin:22px 0 0;background:#f2f1ed;border:1px solid #e7e5df;border-radius:8px;">
                            <tr>
                                <td style="padding:16px 18px;">
                                    <div style="font-size:13px;color:#8f8b82;">Note from our team</div>
                                    <p style="margin:6px 0 0;font-size:14px;line-height:1.6;color:#23221f;" th:text="${request.rejectedReason}">Pilot capacity is currently limited.</p>
                                </td>
                            </tr>
                        </table>
                        <table th:replace="~{email/parts :: note('If your needs change, or you would like us to look again later, just reply to this email.')}"></table>
                    </td>
                </tr>
                <tr><td><div th:replace="~{email/parts :: footer('Sauti answers your business calls in every language.')}"></div></td></tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
