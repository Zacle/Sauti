<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>Your Sauti pilot invitation</title>
</head>
<body style="margin:0;padding:0;background:#f7f6f3;color:#23221f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
<div th:replace="~{email/parts :: preheader(|Your Sauti pilot for ${invitation.businessName} is approved.|)}"></div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#f7f6f3;">
    <tr>
        <td align="center" style="padding:40px 16px;">
            <table role="presentation" width="560" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:560px;">
                <tr><td><div th:replace="~{email/parts :: wordmark}"></div></td></tr>
                <tr>
                    <td style="background:#ffffff;border:1px solid #e7e5df;border-radius:10px;padding:32px 32px 28px;">
                        <h1 th:replace="~{email/parts :: heading('Your workspace is ready to activate')}"></h1>
                        <p style="margin:12px 0 0;font-size:15px;line-height:1.6;color:#5f5c55;">
                            Hello <span th:text="${invitation.contactName}">there</span>, your Sauti pilot for
                            <strong style="color:#23221f;font-weight:600;" th:text="${invitation.businessName}">your business</strong> has been approved.
                            Choose a password to open your workspace.
                        </p>
                        <table th:replace="~{email/parts :: button(${acceptUrl}, 'Activate your workspace')}"></table>
                        <table th:replace="~{email/parts :: note(${'This private link expires in 72 hours and works once. Please don''t forward it.'})}"></table>
                    </td>
                </tr>
                <tr><td><div th:replace="~{email/parts :: footer('Questions before you start? Reply to this email.')}"></div></td></tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
