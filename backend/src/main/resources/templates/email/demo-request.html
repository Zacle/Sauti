<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>New Sauti demo request</title>
</head>
<!-- Internal: sent to Sauti platform admins when a business asks for a demo. -->
<body style="margin:0;padding:0;background:#f7f6f3;color:#23221f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
<div th:replace="~{email/parts :: preheader(|${request.businessName} asked for a demo.|)}"></div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#f7f6f3;">
    <tr>
        <td align="center" style="padding:40px 16px;">
            <table role="presentation" width="560" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:560px;">
                <tr><td><div th:replace="~{email/parts :: wordmark}"></div></td></tr>
                <tr>
                    <td style="background:#ffffff;border:1px solid #e7e5df;border-radius:10px;padding:32px 32px 28px;">
                        <div style="margin:0 0 14px;"><span th:replace="~{email/parts :: status('warning', 'Waiting for review')}"></span></div>
                        <h1 th:replace="~{email/parts :: heading(${request.businessName})}"></h1>
                        <p th:replace="~{email/parts :: paragraph('Asked for a tailored Sauti demo.')}"></p>

                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin:22px 0 0;border-collapse:collapse;">
                            <tr th:replace="~{email/parts :: row('Contact', ${request.contactName})}"></tr>
                            <tr th:replace="~{email/parts :: row('Email', ${request.email})}"></tr>
                            <tr th:replace="~{email/parts :: row('Phone', ${request.phone ?: 'Not provided'})}"></tr>
                            <tr th:replace="~{email/parts :: row('Country', ${request.countryCode})}"></tr>
                            <tr th:replace="~{email/parts :: row('Industry', ${request.industry})}"></tr>
                            <tr th:replace="~{email/parts :: row('Calls per month', ${request.monthlyCallVolume})}"></tr>
                            <tr th:replace="~{email/parts :: row('Channels', ${request.channels})}"></tr>
                            <tr th:replace="~{email/parts :: row('Use case', ${request.primaryUseCase})}"></tr>
                        </table>

                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                               style="margin:18px 0 0;background:#f2f1ed;border:1px solid #e7e5df;border-radius:8px;">
                            <tr>
                                <td style="padding:14px 16px;">
                                    <div style="font-size:13px;color:#8f8b82;">Notes</div>
                                    <p style="margin:6px 0 0;font-size:14px;line-height:1.6;color:#23221f;" th:text="${request.notes ?: 'None'}">Notes</p>
                                </td>
                            </tr>
                        </table>

                        <table th:replace="~{email/parts :: button(${adminReviewUrl}, 'Review in Sauti Admin')}"></table>
                        <table th:replace="~{email/parts :: note(|Request ${request.id}. Sign in with an allowlisted platform-admin email; the link alone does not grant access.|)}"></table>
                    </td>
                </tr>
                <tr><td><div th:replace="~{email/parts :: footer('Internal notification for the Sauti team.')}"></div></td></tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
