<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title th:text="|Call completed · ${agentName}|">Sauti call summary</title>
</head>
<body style="margin:0;padding:0;background:#f7f6f3;color:#23221f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
<div th:replace="~{email/parts :: preheader(|${agentName} handled a call with outcome ${outcome}. ${summary}|)}"></div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#f7f6f3;">
    <tr>
        <td align="center" style="padding:40px 16px;">
            <table role="presentation" width="560" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:560px;">
                <tr><td><div th:replace="~{email/parts :: wordmark}"></div></td></tr>
                <tr>
                    <td style="background:#ffffff;border:1px solid #e7e5df;border-radius:10px;padding:32px 32px 28px;">
                        <div style="margin:0 0 14px;">
                            <span th:replace="~{email/parts :: status('success', ${outcome})}"></span>
                            <span th:if="${testCall}" style="margin-left:12px;font-size:13px;color:#a86a14;">Test call</span>
                        </div>
                        <h1 th:replace="~{email/parts :: heading('Call completed')}"></h1>
                        <p style="margin:12px 0 0;font-size:15px;line-height:1.6;color:#5f5c55;">
                            <strong style="color:#23221f;font-weight:600;" th:text="${agentName}">Agent</strong> handled a call for
                            <span th:text="${businessName}">your workspace</span>.
                        </p>

                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                               style="margin:22px 0 0;background:#f2f1ed;border:1px solid #e7e5df;border-radius:8px;">
                            <tr>
                                <td style="padding:18px 20px;">
                                    <div style="font-size:13px;color:#8f8b82;">Summary</div>
                                    <p style="margin:8px 0 0;font-size:15px;line-height:1.6;color:#23221f;" th:text="${summary}">The caller's request and outcome will appear here.</p>
                                </td>
                            </tr>
                        </table>

                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin:22px 0 0;border-collapse:collapse;">
                            <tr th:replace="~{email/parts :: row('Caller', ${callerPhone})}"></tr>
                            <tr th:replace="~{email/parts :: row('Reason for calling', ${intent})}"></tr>
                            <tr th:replace="~{email/parts :: row('Caller mood', ${sentiment})}"></tr>
                            <tr th:replace="~{email/parts :: row('Started', ${startedAt})}"></tr>
                            <tr th:replace="~{email/parts :: row('Length', ${duration})}"></tr>
                        </table>

                        <table th:replace="~{email/parts :: button(${callUrl}, 'Review call in Sauti')}"></table>
                        <th:block th:if="${hasRecording}"><p th:replace="~{email/parts :: link(${recordingUrl}, 'Listen to the recording')}"></p></th:block>
                    </td>
                </tr>
                <tr><td><div th:replace="~{email/parts :: footer('Sent by Sauti because email delivery is on for this agent. Turn it off in Integrations.')}"></div></td></tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
