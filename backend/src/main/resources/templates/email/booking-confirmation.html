<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title th:text="${notification.heading}">Sauti booking status</title>
</head>
<body style="margin:0;padding:0;background:#f7f6f3;color:#23221f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;"
      th:with="statusText=${#strings.capitalize(#strings.toLowerCase(notification.statusLabel))},
               tone=${notification.cancelled ? 'danger' : (#strings.isEmpty(notification.previousAppointment) ? 'success' : 'warning')}">
<div th:replace="~{email/parts :: preheader(|${statusText}: ${booking.service}, ${booking.appointmentDate} at ${booking.appointmentTime} ${booking.timezone}|)}"></div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#f7f6f3;">
    <tr>
        <td align="center" style="padding:40px 16px;">
            <table role="presentation" width="560" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:560px;">
                <tr><td><div th:replace="~{email/parts :: wordmark}"></div></td></tr>
                <tr>
                    <td style="background:#ffffff;border:1px solid #e7e5df;border-radius:10px;padding:32px 32px 28px;">
                        <div style="margin:0 0 14px;"><span th:replace="~{email/parts :: status(${tone}, ${statusText})}"></span></div>
                        <h1 th:replace="~{email/parts :: heading(${notification.heading})}"></h1>
                        <p style="margin:8px 0 0;font-size:13px;color:#8f8b82;">Reference <span style="color:#5f5c55;" th:text="${booking.bookingNumber}">SAT-XXXXXXXXXXXX</span></p>

                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                               style="margin:22px 0 0;background:#f2f1ed;border:1px solid #e7e5df;border-radius:8px;">
                            <tr>
                                <td style="padding:18px 20px;">
                                    <div style="font-size:13px;color:#8f8b82;" th:text="${notification.cancelled} ? 'Cancelled appointment' : 'Appointment'">Appointment</div>
                                    <div th:style="${notification.cancelled} ? 'margin-top:6px;font-size:24px;line-height:1.2;font-weight:600;letter-spacing:-0.3px;color:#8f8b82;text-decoration:line-through;' : 'margin-top:6px;font-size:24px;line-height:1.2;font-weight:600;letter-spacing:-0.3px;color:#141412;'"
                                         th:text="${booking.appointmentTime}">9:00 AM</div>
                                    <div style="margin-top:4px;font-size:15px;color:#23221f;" th:text="${booking.appointmentDate}">Monday, 3 August 2026</div>
                                    <div style="margin-top:10px;font-size:13px;color:#8f8b82;">
                                        <span th:text="${booking.duration}">1 hour</span> · business time, <span th:text="${booking.timezone}">Africa/Nairobi</span>
                                    </div>
                                </td>
                            </tr>
                        </table>

                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin:22px 0 0;border-collapse:collapse;">
                            <th:block th:if="${!#strings.isEmpty(notification.previousAppointment)}"><tr th:replace="~{email/parts :: row('Previously', ${notification.previousAppointment})}"></tr></th:block>
                            <tr th:replace="~{email/parts :: row('Customer', ${booking.customerName})}"></tr>
                            <tr th:replace="~{email/parts :: row('Service', ${booking.service})}"></tr>
                            <tr th:replace="~{email/parts :: row('Phone', ${booking.customerPhone})}"></tr>
                            <tr th:replace="~{email/parts :: row('Taken by', ${booking.agentName})}"></tr>
                        </table>

                        <table th:if="${calendarSyncFailed}" role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                               style="margin:20px 0 0;border:1px solid #ead7bd;border-radius:8px;background:#fbf6ee;">
                            <tr>
                                <td style="padding:14px 16px;font-size:13px;line-height:1.55;color:#5f5c55;">
                                    <strong style="display:block;color:#a86a14;font-weight:600;">Your calendar was not updated</strong>
                                    <span th:text="${booking.calendarError}">The external calendar could not be updated.</span>
                                    Update it by hand so nobody is double-booked.
                                </td>
                            </tr>
                        </table>

                        <table th:replace="~{email/parts :: button(${bookingsUrl}, 'View booking in Sauti')}"></table>
                        <table th:replace="~{email/parts :: note(|${notification.actionTimeLabel} ${notification.actionTime} (${booking.timezone}).|)}"></table>
                    </td>
                </tr>
                <tr><td><div th:replace="~{email/parts :: footer('Sent by Sauti because booking emails are on for this workspace. Reply if your team needs help.')}"></div></td></tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
