name: Deploy production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-and-deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Copy deployment configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "mkdir -p /opt/sauti"
          scp -i ~/.ssh/deploy_key \
            deploy/Caddyfile \
            deploy/docker-compose.prod.yml \
            deploy/deploy.sh \
            deploy/bootstrap-server-env.sh \
            deploy/backup-postgres.sh \
            deploy/verify-postgres-backup.sh \
            deploy/restore-drill-postgres.sh \
            deploy/validate-restore-target.py \
            deploy/.env.backup-offsite.example \
            deploy/.env.restore-drill.example \
            deploy/configure-external-services-env.sh \
            deploy/test-external-services.sh \
            deploy/migrate-postgres-to-neon.sh \
            deploy/update-public-callbacks-env.sh \
            "$VPS_USER@$VPS_HOST:/opt/sauti/"

      - name: Check out the verified source on the server
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "
            if [ ! -d /opt/sauti/source/.git ]; then
              git clone https://github.com/Zacle/Sauti.git /opt/sauti/source
            fi
            git -C /opt/sauti/source fetch --prune origin
            git -C /opt/sauti/source checkout --force '$IMAGE_TAG'
          "

      - name: Sync optional provider secrets
        env:
          TELNYX_API_KEY: ${{ secrets.TELNYX_API_KEY }}
          TELNYX_PUBLIC_KEY: ${{ secrets.TELNYX_PUBLIC_KEY }}
          TELNYX_CONNECTION_ID: ${{ secrets.TELNYX_CONNECTION_ID }}
          TELNYX_TOOL_WEBHOOK_SECRET: ${{ secrets.TELNYX_TOOL_WEBHOOK_SECRET }}
          SAUTI_OPERATOR_API_KEY: ${{ secrets.SAUTI_OPERATOR_API_KEY }}
          SAUTI_PLATFORM_ADMIN_EMAILS: ${{ secrets.SAUTI_PLATFORM_ADMIN_EMAILS }}
          SAUTI_PUBLIC_DEMO_ENABLED: ${{ vars.SAUTI_PUBLIC_DEMO_ENABLED }}
          SAUTI_PUBLIC_DEMO_TELNYX_AGENT_ID: ${{ vars.SAUTI_PUBLIC_DEMO_TELNYX_AGENT_ID }}
          SAUTI_PUBLIC_DEMO_TELNYX_VERSION_ID: ${{ vars.SAUTI_PUBLIC_DEMO_TELNYX_VERSION_ID }}
          SAUTI_BILLING_PROVIDER: ${{ vars.SAUTI_BILLING_PROVIDER }}
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
          WHOP_COMPANY_ID: ${{ secrets.WHOP_COMPANY_ID }}
          WHOP_WEBHOOK_SECRET: ${{ secrets.WHOP_WEBHOOK_SECRET }}
          WHOP_TENANT_REFERENCE_SECRET: ${{ secrets.WHOP_TENANT_REFERENCE_SECRET }}
          WHOP_API_BASE_URL: ${{ vars.WHOP_API_BASE_URL }}
          WHOP_API_VERSION_DATE: ${{ vars.WHOP_API_VERSION_DATE }}
          WHOP_CHECKOUT_REDIRECT_URL: ${{ vars.WHOP_CHECKOUT_REDIRECT_URL }}
          WHOP_SANDBOX: ${{ vars.WHOP_SANDBOX }}
          WHOP_PLAN_LAUNCH_MONTHLY: ${{ vars.WHOP_PLAN_LAUNCH_MONTHLY }}
          WHOP_PLAN_LAUNCH_ANNUAL: ${{ vars.WHOP_PLAN_LAUNCH_ANNUAL }}
          WHOP_PLAN_GROWTH_MONTHLY: ${{ vars.WHOP_PLAN_GROWTH_MONTHLY }}
          WHOP_PLAN_GROWTH_ANNUAL: ${{ vars.WHOP_PLAN_GROWTH_ANNUAL }}
          WHOP_PLAN_SCALE_MONTHLY: ${{ vars.WHOP_PLAN_SCALE_MONTHLY }}
          WHOP_PLAN_SCALE_ANNUAL: ${{ vars.WHOP_PLAN_SCALE_ANNUAL }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          sync_provider_secret() {
            setting="$1"
            value="$2"
            if [ -z "$value" ]; then
              return
            fi

            key_file="$(mktemp)"
            remote_file="/tmp/sauti_${setting}_env"
            chmod 600 "$key_file"
            printf '%s=%s\n' "$setting" "$value" > "$key_file"
            scp -i ~/.ssh/deploy_key "$key_file" "$VPS_USER@$VPS_HOST:$remote_file"
            rm -f "$key_file"
            ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "
              cd /opt/sauti
              touch .env.production
              grep -v '^${setting}=' .env.production > .env.production.tmp || true
              cat '$remote_file' >> .env.production.tmp
              mv .env.production.tmp .env.production
              chmod 600 .env.production
              rm -f '$remote_file'
            "
          }

          sync_provider_secret TELNYX_API_KEY "$TELNYX_API_KEY"
          sync_provider_secret TELNYX_PUBLIC_KEY "$TELNYX_PUBLIC_KEY"
          sync_provider_secret TELNYX_CONNECTION_ID "$TELNYX_CONNECTION_ID"
          sync_provider_secret TELNYX_TOOL_WEBHOOK_SECRET "$TELNYX_TOOL_WEBHOOK_SECRET"
          sync_provider_secret SAUTI_OPERATOR_API_KEY "$SAUTI_OPERATOR_API_KEY"
          sync_provider_secret SAUTI_PLATFORM_ADMIN_EMAILS "$SAUTI_PLATFORM_ADMIN_EMAILS"
          sync_provider_secret SAUTI_PUBLIC_DEMO_ENABLED "${SAUTI_PUBLIC_DEMO_ENABLED:-false}"
          sync_provider_secret SAUTI_PUBLIC_DEMO_TELNYX_AGENT_ID "$SAUTI_PUBLIC_DEMO_TELNYX_AGENT_ID"
          sync_provider_secret SAUTI_PUBLIC_DEMO_TELNYX_VERSION_ID "$SAUTI_PUBLIC_DEMO_TELNYX_VERSION_ID"
          sync_provider_secret SAUTI_BILLING_PROVIDER "$SAUTI_BILLING_PROVIDER"
          sync_provider_secret WHOP_API_KEY "$WHOP_API_KEY"
          sync_provider_secret WHOP_COMPANY_ID "$WHOP_COMPANY_ID"
          sync_provider_secret WHOP_WEBHOOK_SECRET "$WHOP_WEBHOOK_SECRET"
          sync_provider_secret WHOP_TENANT_REFERENCE_SECRET "$WHOP_TENANT_REFERENCE_SECRET"
          sync_provider_secret WHOP_API_BASE_URL "$WHOP_API_BASE_URL"
          sync_provider_secret WHOP_API_VERSION_DATE "$WHOP_API_VERSION_DATE"
          sync_provider_secret WHOP_CHECKOUT_REDIRECT_URL "$WHOP_CHECKOUT_REDIRECT_URL"
          sync_provider_secret WHOP_SANDBOX "$WHOP_SANDBOX"
          sync_provider_secret WHOP_PLAN_LAUNCH_MONTHLY "$WHOP_PLAN_LAUNCH_MONTHLY"
          sync_provider_secret WHOP_PLAN_LAUNCH_ANNUAL "$WHOP_PLAN_LAUNCH_ANNUAL"
          sync_provider_secret WHOP_PLAN_GROWTH_MONTHLY "$WHOP_PLAN_GROWTH_MONTHLY"
          sync_provider_secret WHOP_PLAN_GROWTH_ANNUAL "$WHOP_PLAN_GROWTH_ANNUAL"
          sync_provider_secret WHOP_PLAN_SCALE_MONTHLY "$WHOP_PLAN_SCALE_MONTHLY"
          sync_provider_secret WHOP_PLAN_SCALE_ANNUAL "$WHOP_PLAN_SCALE_ANNUAL"

      - name: Deploy verified images
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "cd /opt/sauti && IMAGE_TAG='$IMAGE_TAG' bash ./deploy.sh"
